server {
    listen ${PORT};
    server_name _;

    resolver ${RESOLVER} valid=10s;

    # Serve dashboard HTML
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── Registry API ──────────────────────────────
    location /metadata/ {
        set $reg_backend "http://registry.railway.internal:8080";
        proxy_pass $reg_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /schema/ {
        set $reg_backend "http://registry.railway.internal:8080";
        proxy_pass $reg_backend;
        proxy_set_header Host $host;
    }
    location /q/ {
        set $reg_backend "http://registry.railway.internal:8080";
        proxy_pass $reg_backend;
        proxy_set_header Host $host;
    }
    location /.well-known/ {
        set $reg_backend "http://registry.railway.internal:8080";
        proxy_pass $reg_backend;
        proxy_set_header Host $host;
    }

    # ── Validator API ─────────────────────────────
    location /validate/ {
        set $val_backend "http://validator.railway.internal:8080";
        proxy_pass $val_backend;
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /resource/ {
        set $val_backend "http://validator.railway.internal:8080";
        proxy_pass $val_backend;
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ~ ^/validator-health/(.*)$ {
        set $val_backend "http://validator.railway.internal:8080";
        proxy_pass $val_backend/q/$1$is_args$args;
        proxy_set_header Host $host;
    }

    # ── Keycloak ──────────────────────────────────
    location ~ ^/auth/(.*)$ {
        set $kc_backend "http://keycloak.railway.internal:8180";
        proxy_pass $kc_backend/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
