# HTTP Auth policies accepting all roles (lowercase, uppercase, registry-*)
quarkus.http.auth.policy.validation-policy.roles-allowed=admin,eo,eu,ADMIN,EO,EU,registry-admin,registry-eo,registry-eu
quarkus.http.auth.permission.validation.policy=validation-policy
quarkus.http.auth.permission.validation.paths=/validate/v1*

quarkus.http.auth.policy.resource-policy.roles-allowed=admin,eo,eu,ADMIN,EO,EU,registry-admin,registry-eo,registry-eu
quarkus.http.auth.permission.resource.policy=resource-policy
quarkus.http.auth.permission.resource.paths=/resource/v1*

quarkus.http.auth.permission.permit-health.paths=/q/*
quarkus.http.auth.permission.permit-health.policy=permit

# CORS - allow all origins
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
