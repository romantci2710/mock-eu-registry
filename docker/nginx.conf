server {
    listen 80;
    server_name localhost;

    # Serve dashboard HTML
    location / {
        root /usr/share/nginx/html;
        index dpp-test-dashboard.html;
        try_files $uri $uri/ /dpp-test-dashboard.html;
    }

    # ── Registry API ──────────────────────────────
    location /metadata/ {
        proxy_pass http://registry:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /schema/ {
        proxy_pass http://registry:8080;
        proxy_set_header Host $host;
    }
    location /q/ {
        proxy_pass http://registry:8080;
        proxy_set_header Host $host;
    }
    location /.well-known/ {
        proxy_pass http://registry:8080;
        proxy_set_header Host $host;
    }

    # ── Validator API ─────────────────────────────
    location /validate/ {
        proxy_pass http://validator:8080;
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /resource/ {
        proxy_pass http://validator:8080;
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /validator-health/ {
        proxy_pass http://validator:8080/q/;
        proxy_set_header Host $host;
    }

    # ── Keycloak ──────────────────────────────────
    location /auth/ {
        proxy_pass http://keycloak:8180/;
        proxy_set_header Host localhost:8180;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
